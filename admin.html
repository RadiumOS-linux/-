<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a08">
  <title>RadiumOS — News Admin</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="admin.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="footer-brand" href="index.html">RadiumOS / Admin</a>
    <a href="index.html">← На основной сайт</a>
  </header>

  <main class="section content-section">
    <section class="admin-panel">
      <p class="eyebrow">PRIVATE AREA</p>
      <h1>Управление новостями</h1>
      <p class="admin-description">
        Войди через учётную запись PocketBase администратора.
      </p>

      <form id="login-form" class="issue-form">
        <label for="admin-email">Email</label>
        <input
          id="admin-email"
          type="email"
          autocomplete="username"
          required
          value="az99arseniy@gmail.com"
        >

        <label for="admin-password">Пароль</label>
        <input
          id="admin-password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button class="button button-primary" type="submit">Войти</button>
        <p id="login-message" role="status"></p>
      </form>

      <section id="news-editor" hidden>
        <div class="admin-toolbar">
          <h2>Новости</h2>
          <button id="logout-button" class="button button-secondary" type="button">
            Выйти
          </button>
        </div>

        <form id="news-form" class="issue-form">
          <label for="news-title">Заголовок</label>
          <input id="news-title" maxlength="160" required>

          <label for="news-slug">URL-имя</label>
          <input id="news-slug" maxlength="160" placeholder="radiumos-update">

          <label for="news-content">Текст новости</label>
          <textarea id="news-content" rows="8" maxlength="20000" required></textarea>

          <label class="admin-checkbox" for="news-published">
            <input id="news-published" type="checkbox" checked>
            Опубликовать
          </label>

          <button class="button button-primary" type="submit">
            Сохранить новость
          </button>
          <button id="cancel-edit" class="button button-secondary" type="button" hidden>
            Отменить редактирование
          </button>

          <p id="news-message" role="status"></p>
        </form>

        <h2>Все новости</h2>
        <div id="admin-news-list" class="issues-list"></div>
      </section>
    </section>
  </main>
</body>
</html>
